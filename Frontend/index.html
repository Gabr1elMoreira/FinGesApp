<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FinGes App - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            primary: {
              DEFAULT: '#7C5CFC',
              dark: '#6144ef',
              light: '#9b7ffd',
            },
            accent: {
              DEFAULT: '#1AEDB0',
              dark: '#13c994',
            },
            surface: '#15161f',
            card: '#1d1f2e',
            'card-2': '#26283c',
            income: '#22c98e',
            expense: '#ff4465',
          }
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/logo.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7C5CFC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinGes">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    :root {
      --primary: #7C5CFC;
      --primary-glow: rgba(124, 92, 252, 0.25);
      --accent: #1AEDB0;
      --accent-glow: rgba(26, 237, 176, 0.2);
      --income-glow: rgba(34, 201, 142, 0.2);
      --expense-glow: rgba(255, 68, 101, 0.2);
      --warning-glow: rgba(245, 158, 11, 0.2);
      --card-bg: #1d1f2e;
      --card-border: rgba(255, 255, 255, 0.055);
      --surface: #15161f;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f5f9;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
    }

    .dark body {
      background-color: #15161f;
      background-image:
        radial-gradient(ellipse at 10% 40%, rgba(124, 92, 252, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 10%, rgba(26, 237, 176, 0.03) 0%, transparent 40%);
    }

    button, select, input { touch-action: manipulation; }

    /* Selection color */
    ::selection { background: rgba(124,92,252,0.25); color: #fff; }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
